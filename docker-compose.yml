
services:

  mysql:
    image: mysql:8.0
    container_name: cicd-demo-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cicd_demo}
      MYSQL_USER: ${MYSQL_USER:-cicduser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cicdpassword}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - cicd-network


  backend:
    build:
      context: ./backend

    image: cicd-demo-backend:${APP_VERSION:-1.0}

    container_name: cicd-demo-backend

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-cicduser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cicdpassword}
      DB_NAME: ${MYSQL_DATABASE:-cicd_demo}

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - cicd-network


  frontend:
    build:
      context: ./frontend

    image: cicd-demo-frontend:${APP_VERSION:-1.0}

    container_name: cicd-demo-frontend

    ports:
      - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - cicd-network


networks:
  cicd-network:
    driver: bridge


volumes:
  mysql_data:
    name: cicd-demo-mysql-data
